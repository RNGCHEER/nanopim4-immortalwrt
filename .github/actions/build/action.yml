name: Build NanoPi M4
description: Compile a source-matched NanoPi M4 firmware or IPK bundle
inputs:
  distribution:
    description: immortalwrt or istoreos
    required: true
  output-kind:
    description: firmware or packages
    required: true
  source-ref:
    description: Optional source tag or iStoreOS branch
    default: ''
runs:
  using: composite
  steps:
    - name: Prepare runner
      shell: bash
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl jq subversion cmake ninja-build libelf-dev device-tree-compiler qemu-utils zstd
        df -h
    - name: Resolve latest source and add NanoPi M4
      id: source
      shell: bash
      env:
        DISTRO: ${{ inputs.distribution }}
        SOURCE_REF: ${{ inputs.source-ref }}
      run: bash scripts/build.sh source
    - name: Cache source downloads
      uses: actions/cache@v4
      with:
        path: source/dl
        key: dl-${{ runner.os }}-${{ inputs.distribution }}-${{ steps.source.outputs.ref }}-${{ github.run_id }}
        restore-keys: |
          dl-${{ runner.os }}-${{ inputs.distribution }}-${{ steps.source.outputs.ref }}-
    - name: Install official feeds and QuickStart
      shell: bash
      env:
        DISTRO: ${{ inputs.distribution }}
      run: bash scripts/build.sh feeds
    - name: Configure Argon and QuickStart
      shell: bash
      env:
        DISTRO: ${{ inputs.distribution }}
      run: bash scripts/build.sh configure
    - name: Upload resolved build configuration
      uses: actions/upload-artifact@v4
      with:
        name: config-${{ inputs.distribution }}-${{ inputs.output-kind }}-${{ github.run_id }}
        path: |
          output/build.config
          output/build-info.txt
          output/diffconfig
        if-no-files-found: error
        retention-days: 7
    - name: Compile
      shell: bash
      env:
        DISTRO: ${{ inputs.distribution }}
        OUTPUT_KIND: ${{ inputs.output-kind }}
      run: bash scripts/build.sh compile
    - name: Collect and verify output
      shell: bash
      env:
        DISTRO: ${{ inputs.distribution }}
        OUTPUT_KIND: ${{ inputs.output-kind }}
      run: bash scripts/build.sh collect
    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.distribution }}-nanopi-m4-${{ inputs.output-kind }}-${{ github.run_id }}
        path: output/
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ inputs.distribution }}-${{ inputs.output-kind }}-${{ github.run_id }}
        path: |
          source.log
          feeds.log
          configure.log
          compile.log
          build.log
          download.log
          output/build-info.txt
          output/build.config
          output/requested.config
          output/config-package.in
          output/packageinfo
          source/logs/
        if-no-files-found: ignore
        retention-days: 7

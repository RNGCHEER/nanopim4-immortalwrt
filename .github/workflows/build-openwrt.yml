name: Build NanoPi M4 IPK Packages
on:
  push:
    branches: [main]
    paths: ['.config', 'files/**', 'scripts/**', '.github/actions/build/**', '.github/workflows/build-openwrt.yml']
  workflow_dispatch:
    inputs:
      distribution:
        description: Firmware family for matching IPK packages
        type: choice
        options: [immortalwrt, istoreos]
        default: immortalwrt
      source_ref:
        description: 'Stable tag (blank = latest stable ImmortalWrt)'
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: ipk-${{ inputs.distribution || 'immortalwrt' }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          distribution: ${{ inputs.distribution || 'immortalwrt' }}
          output-kind: packages
          source-ref: ${{ inputs.source_ref }}
      - name: Publish IPK bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipk-${{ inputs.distribution || 'immortalwrt' }}-nanopi-m4-${{ github.run_id }}
          name: NanoPi M4 IPK ${{ inputs.distribution || 'immortalwrt' }} ${{ env.SOURCE_REF_RESOLVED }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            output/*-ipk.tar.gz
            output/build-info.txt
            output/build.config
            output/sha256sums
          body: |
            Compiled IPK packages for the selected distribution, including target-specific kernel modules.
            Compare build-info.txt with the firmware before installing kernel modules.
            Packages from different firmware families are not interchangeable.
            See build-info.txt for exact source and feed revisions.

name: Build iStore OS for NanoPi M4

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-22.03
  FEEDS_CONF: feeds.conf
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free up disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialize build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2 python2.7 python3 python3-pyelftools python3-setuptools libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo timedatectl set-timezone Asia/Shanghai
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} --depth 1 openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        mv $GITHUB_WORKSPACE/istoreos/rk33xx/${{ env.FEEDS_CONF }} openwrt/${{ env.FEEDS_CONF }}
        chmod +x $GITHUB_WORKSPACE/istoreos/${{ env.DIY_P1_SH }}
        cd openwrt
        $GITHUB_WORKSPACE/istoreos/${{ env.DIY_P1_SH }}

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        mv $GITHUB_WORKSPACE/istoreos/rk33xx/${{ env.CONFIG_FILE }} openwrt/${{ env.CONFIG_FILE }}
        chmod +x $GITHUB_WORKSPACE/istoreos/${{ env.DIY_P2_SH }}
        cd openwrt
        $GITHUB_WORKSPACE/istoreos/${{ env.DIY_P2_SH }}

    - name: Download packages
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check disk space
      if: (!cancelled())
      run: df -hT

    - name: Organize firmware files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt
        ls -la bin/targets/
        FIRMWARE_DIR=$(find bin/targets -type d -maxdepth 2 | head -1)
        if [ -z "$FIRMWARE_DIR" ]; then
          echo "ERROR: No firmware directory found!"
          exit 1
        fi
        cd "$FIRMWARE_DIR"
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "Found firmware files:"
        ls -la
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to GitHub Actions
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: iStoreOS-NanoPiM4${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H.%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: iStoreOS-${{ steps.tag.outputs.release_tag }}
        name: iStore OS NanoPi M4 Build
        body: |
          ## iStore OS for NanoPi M4
          
          **架构**: Rockchip RK3399 (NanoPi M4)
          
          **源码**: ${{ env.REPO_URL }}
          
          **分支**: ${{ env.REPO_BRANCH }}
          
          **管理地址**: 192.168.1.1
          
          **用户名**: root
          
          **密码**: password
          
          ### 支持的设备
          - FriendlyElec NanoPi M4
          
          ### 主要功能
          - iStore 应用商店
          - Docker 支持
          - NAS 功能 (SMB/NFS)
          - 4G/5G 模组支持
        files: ${{ env.FIRMWARE }}/*
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build iStore OS for NanoPi M4
on:
  push:
    branches: [main]
    paths: ['.config', 'files/**', 'scripts/**', '.github/actions/build/**', '.github/workflows/build-istoreos.yml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'iStoreOS branch (blank = latest istoreos-24.10 commit)'
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: istoreos-firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build
        with:
          distribution: istoreos
          output-kind: firmware
          source-ref: ${{ inputs.source_ref }}
      - name: Publish istoreos firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: istoreos-nanopi-m4-${{ github.run_id }}
          name: istoreos NanoPi M4 ${{ env.SOURCE_REF_RESOLVED }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            output/*nanopi-m4*.img.gz
            output/build-info.txt
            output/build.config
            output/sha256sums
          body: |
            istoreos source build with Argon, official iStoreOS QuickStart and iStore.
            LAN: eth0, 192.168.1.1; WAN: USB networking. Login: root / password.
            Change the password after first login. Native source-built images; no substitute rootfs.
            See build-info.txt for exact source and feed revisions.

name: Build iStore OS for NanoPi M4

on:
  push:
    branches:
      - main
    tags:
      - "iStoreOS-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free up disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Build FriendlyElec U-Boot for NanoPi M4
      run: |
        sudo apt-get update
        sudo apt-get install -y git bc bison build-essential flex gcc-aarch64-linux-gnu g++-aarch64-linux-gnu device-tree-compiler python3 swig libssl-dev
        
        # Clone rkbin (binary blobs)
        git clone --depth 1 -b friendlyelec https://github.com/friendlyarm/rkbin.git
        
        # Clone U-Boot source
        git clone --depth 1 -b nanopi4-v2017.09 https://github.com/friendlyarm/uboot-rockchip.git
        
        # Build U-Boot for NanoPi M4
        cd uboot-rockchip
        ./make.sh nanopi4
        
        echo "=== Build output ==="
        ls -la *.img *.bin 2>/dev/null || true
        
        # Create u-boot-rockchip.bin for OpenWrt pine64-bin boot flow
        if [ -f idbloader.bin ] && [ -f uboot.img ]; then
          echo "Creating u-boot-rockchip.bin..."
          dd if=idbloader.bin of=u-boot-rockchip.bin bs=512 conv=notrunc
          dd if=uboot.img of=u-boot-rockchip.bin bs=512 seek=64 conv=notrunc
        fi
        
        echo "=== Final U-Boot files ==="
        ls -la *.bin *.img 2>/dev/null
        
        # Copy to known location
        mkdir -p /tmp/uboot-output
        cp -f u-boot-rockchip.bin /tmp/uboot-output/ 2>/dev/null || true
        cp -f idbloader.bin /tmp/uboot-output/ 2>/dev/null || true
        cp -f trust.img /tmp/uboot-output/ 2>/dev/null || true
        cp -f uboot.img /tmp/uboot-output/ 2>/dev/null || true
        ls -la /tmp/uboot-output/

    - name: Clone iStore OS
      run: |
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply python3-docutils python3-pyelftools python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev
        rm -rf istoreos
        git clone -b istoreos-24.10 --depth 1 https://github.com/istoreos/istoreos.git

    - name: Add NanoPi M4 device and inject U-Boot
      working-directory: istoreos
      run: |
        # Add device profile to armv8.mk (based on NanoPC-T4)
        if ! grep -q "nanopi-m4" target/linux/rockchip/image/armv8.mk; then
          echo "Adding NanoPi M4 device..."
          sed -n '/define Device\/friendlyarm_nanopc-t4/,/TARGET_DEVICES += friendlyarm_nanopc-t4/p' target/linux/rockchip/image/armv8.mk > /tmp/nanopc-t4-def.txt
          sed 's/nanopc-t4/nanopi-m4/g; s/NanoPC T4/NanoPi M4/g' /tmp/nanopc-t4-def.txt >> target/linux/rockchip/image/armv8.mk
        fi

        # Inject pre-built U-Boot
        echo "Injecting pre-built U-Boot..."
        mkdir -p staging_dir/target-aarch64_generic_musl/image/
        cp /tmp/uboot-output/u-boot-rockchip.bin staging_dir/target-aarch64_generic_musl/image/nanopi-m4-rk3399-u-boot-rockchip.bin 2>/dev/null || true
        
        mkdir -p build_dir/target-aarch64_generic_musl/linux-rockchip_armv8/image/
        cp /tmp/uboot-output/u-boot-rockchip.bin build_dir/target-aarch64_generic_musl/linux-rockchip_armv8/image/nanopi-m4-rk3399-u-boot-rockchip.bin 2>/dev/null || true
        
        echo "=== U-Boot files injected ==="
        find staging_dir -name "*nanopi-m4*" -type f 2>/dev/null || echo "Not in staging"
        find build_dir -name "*nanopi-m4*u-boot*" -type f 2>/dev/null || echo "Not in build"

    - name: Configure iStore OS
      working-directory: istoreos
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "CONFIG_TARGET_rockchip=y" > .config
        echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
        echo "CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-m4=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_EXT4FS=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
        echo "CONFIG_TARGET_ROOTFS_PARTSIZE=4096" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-bootstrap=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
        echo "CONFIG_PACKAGE_docker-ce=y" >> .config
        echo "CONFIG_PACKAGE_docker-ce-cli=y" >> .config
        echo "CONFIG_PACKAGE_containerd=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
        make defconfig
        grep "DEVICE_friendlyarm" .config || echo "WARNING: No device selected!"

    - name: Compile firmware
      working-directory: istoreos
      run: |
        make -j$(nproc) || make -j1 V=s
        echo "BUILD_STATUS=success" >> $GITHUB_ENV

    - name: Organize files
      if: env.BUILD_STATUS == 'success'
      working-directory: istoreos
      run: |
        mkdir -p ../output
        find bin/targets -name "*.img.gz" -exec cp {} ../output/ \;
        find bin/targets -name "*.img" -exec cp {} ../output/ \;
        find bin/targets -name "*.bin" -exec cp {} ../output/ \;
        find bin/targets -name "*.itb" -exec cp {} ../output/ \;
        ls -la ../output/

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: env.BUILD_STATUS == 'success'
      with:
        name: iStoreOS-NanoPiM4-${{ github.run_id }}
        path: output/

    - name: Generate release tag
      id: tag
      if: env.BUILD_STATUS == 'success'
      run: echo "RELEASE_TAG=iStoreOS-$(date +%%Y.%%m.%%d.%%H%%M)" >> $GITHUB_OUTPUT

    - name: Create Release
      if: env.BUILD_STATUS == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
        name: "iStore OS NanoPi M4 Build ${{ github.run_id }}"
        body: |
          ## iStore OS NanoPi M4 Build
          ### Features
          - Docker 支持
          - iStore 应用商店
          ### Default Login
          - 地址: 192.168.1.1
          - 密码: password
          ### Files
          - *.img.gz / *.img - 固件镜像 (写入 TF卡/eMMC)
        files: |
          output/*.img.gz
          output/*.img
          output/*.bin
          output/*.itb
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

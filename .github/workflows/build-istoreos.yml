name: Build iStore OS for NanoPi M4

on:
  push:
    branches:
      - main
    tags:
      - "iStoreOS-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free up disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply python3-docutils python3-pyelftools python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev lz4

    - name: Clone iStore OS
      run: |
        echo "=== Cloning iStore OS ==="
        rm -rf istoreos
        git clone -b istoreos-24.10 --depth 1 https://github.com/istoreos/istoreos.git

    - name: Add NanoPi M4 device support
      working-directory: istoreos
      run: |
        echo "=== Adding NanoPi M4 device support ==="
        if ! grep -q "nanopi-m4" target/linux/rockchip/image/armv8.mk; then
          echo "" >> target/linux/rockchip/image/armv8.mk
          echo "define Device/friendlyarm_nanopi-m4" >> target/linux/rockchip/image/armv8.mk
          echo "  DEVICE_VENDOR := FriendlyARM" >> target/linux/rockchip/image/armv8.mk
          echo "  DEVICE_MODEL := NanoPi M4" >> target/linux/rockchip/image/armv8.mk
          echo "  SOC := rk3399" >> target/linux/rockchip/image/armv8.mk
          echo "  DEVICE_PACKAGES := kmod-usb2 kmod-usb3" >> target/linux/rockchip/image/armv8.mk
          echo "  KERNEL_INSTALL := 1" >> target/linux/rockchip/image/armv8.mk
          echo "  IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata" >> target/linux/rockchip/image/armv8.mk
          echo "  SUPPORTED_DEVICES := friendlyarm,nanopi-m4" >> target/linux/rockchip/image/armv8.mk
          echo "endef" >> target/linux/rockchip/image/armv8.mk
          echo "TARGET_DEVICES += friendlyarm_nanopi-m4" >> target/linux/rockchip/image/armv8.mk
          echo "Device added to armv8.mk"
        fi
        echo "=== Verify device added ==="
        grep -A10 "define Device/friendlyarm_nanopi-m4" target/linux/rockchip/image/armv8.mk

    - name: Configure iStore OS
      working-directory: istoreos
      run: |
        echo "=== Configuring iStore OS ==="
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        cat > .config << 'EOF'
        CONFIG_TARGET_rockchip=y
        CONFIG_TARGET_rockchip_armv8=y
        CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-m4=y
        CONFIG_TARGET_ROOTFS_EXT4FS=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_TARGET_ROOTFS_PARTSIZE=4096
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-app-dockerman=y
        CONFIG_PACKAGE_docker-ce=y
        CONFIG_PACKAGE_docker-ce-cli=y
        CONFIG_PACKAGE_containerd=y
        CONFIG_PACKAGE_luci-app-store=y
        CONFIG_PACKAGE_kmod-usb2=y
        CONFIG_PACKAGE_kmod-usb3=y
        CONFIG_PACKAGE_kmod-usb-storage=y
        EOF
        make defconfig
        echo "=== Selected device ==="
        grep "DEVICE_friendlyarm" .config || echo "No FriendlyARM device selected!"

    - name: Download packages
      working-directory: istoreos
      run: make download -j8

    - name: Compile iStore OS rootfs
      working-directory: istoreos
      run: |
        echo "=== Compiling iStore OS ==="
        make -j$(nproc) V=s || make -j1 V=s
        echo BUILD_STATUS=success >> $GITHUB_ENV

    - name: Clone sd-fuse_rk3399
      if: env.BUILD_STATUS == 'success'
      run: |
        echo "=== Cloning sd-fuse_rk3399 ==="
        git clone -b kernel-6.6.y --depth 1 https://github.com/friendlyarm/sd-fuse_rk3399.git
        cd sd-fuse_rk3399
        echo "=== Downloading pre-built images ==="
        wget -q https://downloads.friendlyelec.com/os-images/rk3399/images/friendlywrt25-images.tgz || \
        wget -q https://downloads.friendlyelec.com/os-images/rk3399/images/openmediavault-arm64-images.tgz || echo "Download failed"
        ls -la
        if [ -f "friendlywrt25-images.tgz" ]; then
          tar xvzf friendlywrt25-images.tgz
          echo "=== friendlywrt25 images extracted ==="
          ls -la friendlywrt25/
        elif [ -f "openmediavault-arm64-images.tgz" ]; then
          tar xvzf openmediavault-arm64-images.tgz
          echo "=== openmediavault images extracted ==="
          ls -la openmediavault-arm64/
        fi

    - name: Create iStore OS image
      if: env.BUILD_STATUS == 'success'
      run: |
        echo "=== Creating bootable image ==="
        cd sd-fuse_rk3399
        if [ -d "friendlywrt25" ]; then
          BASE_OS="friendlywrt25"
        elif [ -d "openmediavault-arm64" ]; then
          BASE_OS="openmediavault-arm64"
        else
          echo "ERROR: No base OS found!"
          exit 1
        fi
        echo "Using base OS: $BASE_OS"
        cp -r "$BASE_OS" istoreos-nanopi-m4
        ROOTFS_TAR=$(find ../istoreos/bin/targets -name "rootfs.tar.gz" | head -1)
        if [ -n "$ROOTFS_TAR" ]; then
          echo "Found rootfs: $ROOTFS_TAR"
          sudo rm -rf istoreos-nanopi-m4/rootfs
          sudo mkdir -p istoreos-nanopi-m4/rootfs
          sudo tar xzf "$ROOTFS_TAR" -C istoreos-nanopi-m4/rootfs/
          echo "Rootfs replaced"
        else
          echo "WARNING: Using default rootfs"
        fi
        export SDFUSE_NONINTERACTIVE=y
        ./mk-sd-image.sh istoreos-nanopi-m4
        echo "=== Image build complete ==="
        ls -la out/*.img 2>/dev/null || echo "No image found"

    - name: Organize output
      if: env.BUILD_STATUS == 'success'
      run: |
        mkdir -p output
        if [ -f "sd-fuse_rk3399/out/rk3399-sd-*.img" ]; then
          cp sd-fuse_rk3399/out/rk3399-sd-*.img output/
        fi
        find istoreos/bin/targets -name "*.img.gz" -exec cp {} output/ \; 2>/dev/null || true
        find istoreos/bin/targets -name "*.img" -exec cp {} output/ \; 2>/dev/null || true
        echo "=== Output files ==="
        ls -la output/

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: env.BUILD_STATUS == 'success'
      with:
        name: iStoreOS-NanoPiM4-${{ github.run_id }}
        path: output/

    - name: Generate release tag
      id: tag
      if: env.BUILD_STATUS == 'success'
      run: echo "RELEASE_TAG=iStoreOS-NanoPiM4-$(date +%%Y.%%m.%%d.%%H%%M)" >> $GITHUB_OUTPUT

    - name: Create Release
      if: env.BUILD_STATUS == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
        name: "iStore OS NanoPi M4 Build ${{ github.run_id }}"
        body: |
          ## iStore OS NanoPi M4 Build
          ### Features
          - Docker support
          - iStore App Store
          - Official U-Boot v2017.09
          ### Default Login
          - Address: 192.168.1.1
          - Password: password
          ### Write to TF card
          sudo dd if=output/rk3399-sd-*.img of=/dev/sdX bs=4M status=progress
        files: |
          output/*.img.gz
          output/*.img
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

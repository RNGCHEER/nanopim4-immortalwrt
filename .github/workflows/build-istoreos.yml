name: Build iStore OS for NanoPi M4

on:
  push:
    branches:
      - main
    tags:
      - "iStoreOS-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free up disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clone iStore OS
      run: |
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply python3-docutils python3-pyelftools python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev
        rm -rf istoreos
        git clone -b istoreos-24.10 --depth 1 https://github.com/istoreos/istoreos.git

    - name: Add NanoPi M4 device and U-Boot definition
      working-directory: istoreos
      run: |
        # Add device profile to armv8.mk
        if ! grep -q "nanopi-m4" target/linux/rockchip/image/armv8.mk; then
          echo "Adding NanoPi M4 device to armv8.mk..."
          sed -n '/define Device\/friendlyarm_nanopc-t4/,/TARGET_DEVICES += friendlyarm_nanopc-t4/p' target/linux/rockchip/image/armv8.mk > /tmp/nanopc-t4-def.txt
          sed 's/nanopc-t4/nanopi-m4/g; s/NanoPC T4/NanoPi M4/g' /tmp/nanopc-t4-def.txt >> target/linux/rockchip/image/armv8.mk
          echo "=== NanoPi M4 device added ==="
          grep -A10 "define Device/friendlyarm_nanopi-m4" target/linux/rockchip/image/armv8.mk
        fi

        # Add U-Boot definition to uboot-rockchip Makefile
        if ! grep -q "nanopi-m4-rk3399" package/boot/uboot-rockchip/Makefile; then
          echo "Adding NanoPi M4 U-Boot definition..."
          # Extract nanopc-t4 U-Boot definition
          sed -n '/define U-Boot\/nanopc-t4-rk3399/,/^endef/p' package/boot/uboot-rockchip/Makefile > /tmp/nanopc-t4-uboot.txt
          cat /tmp/nanopc-t4-uboot.txt
          
          # Create NanoPi M4 U-Boot definition
          sed 's/nanopc-t4/nanopi-m4/g; s/NanoPC T4/NanoPi M4/g' /tmp/nanopc-t4-uboot.txt >> package/boot/uboot-rockchip/Makefile
          
          # Add to UBOOT_TARGETS list
          sed -i '/nanopc-t4-rk3399/a\  nanopi-m4-rk3399 \\' package/boot/uboot-rockchip/Makefile
          
          echo "=== NanoPi M4 U-Boot added ==="
          grep -A10 "define U-Boot/nanopi-m4-rk3399" package/boot/uboot-rockchip/Makefile
        fi

    - name: Configure and build U-Boot
      working-directory: istoreos
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        cat > .config << 'EOF'
        CONFIG_TARGET_rockchip=y
        CONFIG_TARGET_rockchip_armv8=y
        CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-m4=y
        CONFIG_TARGET_ROOTFS_EXT4FS=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_TARGET_ROOTFS_PARTSIZE=4096
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-app-dockerman=y
        CONFIG_PACKAGE_docker-ce=y
        CONFIG_PACKAGE_docker-ce-cli=y
        CONFIG_PACKAGE_containerd=y
        CONFIG_PACKAGE_luci-app-store=y
        EOF
        make defconfig
        
        echo "=== Building U-Boot ==="
        make package/boot/uboot-rockchip/compile -j$(nproc) V=s || true
        
        echo "=== Checking U-Boot output ==="
        find staging_dir -name "*u-boot-rockchip.bin" -type f 2>/dev/null
        ls -la staging_dir/target-aarch64_generic_musl/image/ 2>/dev/null | grep -i "nanopi\|u-boot" || true

    - name: Compile firmware
      working-directory: istoreos
      run: |
        make -j$(nproc) || make -j1 V=s
        echo "BUILD_STATUS=success" >> $GITHUB_ENV

    - name: Organize files
      if: env.BUILD_STATUS == 'success'
      working-directory: istoreos
      run: |
        mkdir -p ../output
        find bin/targets -name "*.img.gz" -exec cp {} ../output/ \;
        find bin/targets -name "*.img" -exec cp {} ../output/ \;
        find bin/targets -name "*.bin" -exec cp {} ../output/ \;
        find bin/targets -name "*.itb" -exec cp {} ../output/ \;
        ls -la ../output/

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: env.BUILD_STATUS == 'success'
      with:
        name: iStoreOS-NanoPiM4-${{ github.run_id }}
        path: output/

    - name: Generate release tag
      id: tag
      if: env.BUILD_STATUS == 'success'
      run: echo "RELEASE_TAG=iStoreOS-$(date +%%Y.%%m.%%d.%%H%%M)" >> $GITHUB_OUTPUT

    - name: Create Release
      if: env.BUILD_STATUS == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
        name: "iStore OS NanoPi M4 Build ${{ github.run_id }}"
        body: |
          ## iStore OS NanoPi M4 Build
          ### Features
          - Docker 支持
          - iStore 应用商店
          ### Default Login
          - 地址: 192.168.1.1
          - 密码: password
          ### Files
          - *.img.gz / *.img - 固件镜像 (写入 TF卡/eMMC)
        files: |
          output/*.img.gz
          output/*.img
          output/*.bin
          output/*.itb
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build ImmortalWrt for NanoPi M4

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free up disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialize ImmortalWrt
      run: |
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev
        # openwrt-24.10 branch -> official 6.6.x LTS kernel (KERNEL_PATCHVER=6.6)
        git clone -b openwrt-24.10 --depth 1 https://github.com/immortalwrt/immortalwrt.git
        cd immortalwrt
        # Add NanoPi M4 device profile + U-Boot (official mainline DTS/U-Boot already exist)
        cp ../patches/*.patch .
        patch -p1 < 001-add-nanopi-m4-device.patch
        patch -p1 < 002-add-nanopi-m4-uboot.patch
        # iStore feed is required for luci-app-store (not in ImmortalWrt feeds)
        echo 'src-git istore https://github.com/linkease/istore.git;main' >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        cp ../.config .
        make defconfig
        # Sanity check: M4 device must be selected after defconfig
        grep -E '^CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-m4=y$' .config || { echo 'NanoPi M4 device not selected!'; exit 1; }

    - name: Download packages
      run: |
        cd immortalwrt
        make download -j8

    - name: Compile firmware
      run: |
        cd immortalwrt
        make -j$(nproc) || make -j1 V=s
        echo BUILD_STATUS=success >> $GITHUB_ENV

    - name: Organize files
      if: env.BUILD_STATUS == 'success'
      run: |
        cd immortalwrt
        mkdir -p ../output
        find bin/targets -name "*.img.gz" -exec cp {} ../output/ \;
        find bin/targets -name "*.bin" -exec cp {} ../output/ \;

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: env.BUILD_STATUS == 'success'
      with:
        name: ImmortalWrt-NanoPiM4
        path: output/

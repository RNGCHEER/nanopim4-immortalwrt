name: Build ImmortalWrt for NanoPi M4

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free up disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Initialize ImmortalWrt
      run: |
        sudo apt-get update
        sudo apt-get install -y ack antlr3 asciidoc autoconf automake binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pip python3-ply python3-docutils python3-pyelftools python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev
        # Install Go for OpenClash
        wget -q https://go.dev/dl/go1.22.4.linux-amd64.tar.gz
        sudo tar -C /usr/local -xzf go1.22.4.linux-amd64.tar.gz
        echo 'export PATH=$PATH:/usr/local/go/bin' >> $HOME/.bashrc
        echo 'export GOPATH=$HOME/go' >> $HOME/.bashrc
        echo 'export PATH=$PATH:$GOPATH/bin' >> $HOME/.bashrc
        export PATH=$PATH:/usr/local/go/bin
        export GOPATH=$HOME/go
        go version
        # openwrt-24.10 branch -> official 6.6.x LTS kernel (KERNEL_PATCHVER=6.6)
        git clone -b openwrt-24.10 --depth 1 https://github.com/immortalwrt/immortalwrt.git
        cd immortalwrt
        # Add NanoPi M4 device profile + U-Boot (official mainline DTS/U-Boot already exist)
        cp ../patches/*.patch .
        patch -p1 < 001-add-nanopi-m4-device.patch
        patch -p1 < 002-add-nanopi-m4-uboot.patch
        # iStore feed is required for luci-app-store (not in ImmortalWrt feeds)
        echo 'src-git istore https://github.com/linkease/istore.git;main' >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # Fix network configuration for single Ethernet port (NanoPi M4)
        mkdir -p files/etc/uci-defaults
        cat > files/etc/uci-defaults/99-nanopi-m4-network << 'NETEOF'
        #!/bin/sh
        # NanoPi M4 single port network configuration
        
        # Delete default WAN and WAN6 interfaces
        uci delete network.wan 2>/dev/null || true
        uci delete network.wan6 2>/dev/null || true
        
        # Configure LAN to use eth0 (single Ethernet port)
        uci set network.lan.device='eth0'
        uci set network.lan.proto='static'
        uci set network.lan.ipaddr='192.168.1.1'
        uci set network.lan.netmask='255.255.255.0'
        
        # Disable WAN firewall zone
        uci delete firewall.@zone[1] 2>/dev/null || true
        
        # Commit changes
        uci commit network
        uci commit firewall
        
        echo "NanoPi M4 network configured: single LAN port on eth0"
        NETEOF
        chmod +x files/etc/uci-defaults/99-nanopi-m4-network

        # Use custom .config for image generation
        cat > .config << 'EOF'
        # Target System
        CONFIG_TARGET_rockchip=y
        CONFIG_TARGET_rockchip_armv8=y
        CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-m4=y
        
        # Target Images - Generate IMG files
        CONFIG_TARGET_ROOTFS_EXT4FS=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        # Root partition 4GB (4096 MiB)
        CONFIG_TARGET_ROOTFS_PARTSIZE=4096
        
        # General Configuration
        CONFIG_PACKAGE_ipv6=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_wget-ssl=y
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_openssh-sftp-server=y
        
        # LuCI Web Interface
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-compat=y
        CONFIG_PACKAGE_luci-lib-ipkg=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-opkg=y
        
        # LuCI Theme
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        
        # Kernel Modules - USB
        CONFIG_PACKAGE_kmod-usb-core=y
        CONFIG_PACKAGE_kmod-usb2=y
        CONFIG_PACKAGE_kmod-usb3=y
        CONFIG_PACKAGE_kmod-usb-storage=y
        
        # Kernel Modules - Filesystem
        CONFIG_PACKAGE_kmod-fs-ext4=y
        CONFIG_PACKAGE_kmod-fs-vfat=y
        CONFIG_PACKAGE_kmod-nls-cp437=y
        CONFIG_PACKAGE_kmod-nls-iso8859-1=y
        
        # Network Configuration
        CONFIG_PACKAGE_dnsmasq-full=y
        CONFIG_PACKAGE_dnsmasq_full_dhcp=y
        CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
        CONFIG_PACKAGE_dnsmasq_full_ipset=y
        CONFIG_PACKAGE_dnsmasq_full_nftset=y
        CONFIG_PACKAGE_odhcp6c=y
        CONFIG_PACKAGE_odhcpd-ipv6only=y
        
        # SSH
        CONFIG_PACKAGE_openssh-server-default=y
        
        # Firewall
        CONFIG_PACKAGE_iptables-nft=y
        
        # Docker Support
        CONFIG_PACKAGE_luci-app-dockerman=y
        CONFIG_PACKAGE_docker-ce=y
        CONFIG_PACKAGE_docker-ce-cli=y
        CONFIG_PACKAGE_containerd=y
        
        # iStore OS Store
        CONFIG_PACKAGE_luci-app-store=y
        
        # OpenClash
        CONFIG_PACKAGE_luci-app-openclash=y
        EOF
        make defconfig
        # Sanity check: M4 device must be selected after defconfig
        grep -E '^CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-m4=y$' .config || { echo 'NanoPi M4 device not selected!'; exit 1; }

    - name: Download packages
      run: |
        cd immortalwrt
        make download -j8

    - name: Compile firmware
      run: |
        cd immortalwrt
        make -j$(nproc) || make -j1 V=s
        echo BUILD_STATUS=success >> $GITHUB_ENV

    - name: Organize files
      if: env.BUILD_STATUS == 'success'
      run: |
        cd immortalwrt
        mkdir -p ../output
        # Copy firmware images (IMG files for TF card/eMMC)
        find bin/targets -name "*.img.gz" -exec cp {} ../output/ \;
        find bin/targets -name "*.img" -exec cp {} ../output/ \;
        find bin/targets -name "*.bin" -exec cp {} ../output/ \;
        find bin/targets -name "*.itb" -exec cp {} ../output/ \;
        echo "=== Output files ==="
        ls -la ../output/

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: env.BUILD_STATUS == 'success'
      with:
        name: ImmortalWrt-NanoPiM4-${{ github.run_id }}
        path: output/

    - name: Generate release tag
      id: tag
      if: env.BUILD_STATUS == 'success'
      run: |
        echo "RELEASE_TAG=build-$(date +%%Y.%%m.%%d.%%H%%M)" >> $GITHUB_OUTPUT

    - name: Create Release
      if: env.BUILD_STATUS == 'success'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
        name: "ImmortalWrt NanoPi M4 Build ${{ github.run_id }}"
        body: |
          ## ImmortalWrt NanoPi M4 Build
          
          ### Features
          - Docker 支持
          - OpenClash (科学上网)
          - 4G/5G 模组支持
          
          ### Supported Devices
          - FriendlyElec NanoPi M4
          
          ### Default Login
          - 地址: 192.168.1.1
          - 用户名: root
          - 密码: password
          
          ### Network Configuration
          - 单网口模式 (NanoPi M4 只有一个网口)
          - 网口配置为 LAN 模式
          - DHCP 服务器自动分配 IP
          
          ### Files
          - `*.img.gz` / `*.img` - 固件镜像 (用于 dd 或 Etcher 写入 TF卡/eMMC)
        files: |
          output/*.img.gz
          output/*.img
          output/*.bin
          output/*.itb
        draft: false
        prerelease: false
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
